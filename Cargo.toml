[workspace]
members = ["crates/websnark-rs", "crates/websnark-cli"]
resolver = "2"

[workspace.dependencies]
anyhow = "1.0.102"
ark-bn254 = "0.5.0"
ark-ec = "0.5.0"
ark-ff = "0.5.0"
ark-poly = "0.5.0"
ark-serialize = "0.5.0"
ark-std = "0.5.0"
lalrpop-util = "0.23.1"
num-bigint = "0.4.6"
num-traits = "0.2.19"
postcard = "1.1.3"
rustc-hash = "2.1.2"
serde = "1"
serde_json = "1"
tracing = "0.1.44"
insta = "1.47.2"
tracing-test = "0.2.6"
criterion = "0.8.2"
wasm-bindgen = "=0.2.118"
wasm-bindgen-rayon = "1.3.0"
wasm-bindgen-test = "=0.3.68"
lalrpop = "0.23.1"
websnark-rs = { path = "crates/websnark-rs" }
clap = "4.6.1"
