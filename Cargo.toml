[workspace]
members = ["crates/websnark-rs", "crates/websnark-cli"]
resolver = "2"

[workspace.dependencies]
anyhow = "1.0.102"
ark-bn254 = { version = "0.5.0", features = ["std"] }
ark-ec = { version = "0.5.0", features = ["std"] }
ark-ff = { version = "0.5.0", features = ["std"] }
ark-poly = { version = "0.5.0", features = ["std"] }
ark-serialize = "0.5.0"
ark-std = "0.5.0"
lalrpop-util = "0.23.1"
num-bigint = "0.4.6"
num-traits = "0.2.19"
postcard = { version = "1.1.3", features = ["alloc"] }
rustc-hash = "2.1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1.44"
insta = "1.47.2"
tracing-test = "0.2.6"
criterion = "0.8.2"
wasm-bindgen = "=0.2.118"
wasm-bindgen-rayon = { version = "1.3.0" }
wasm-bindgen-test = "=0.3.68"
lalrpop = "0.23.1"
websnark-rs = { path = "crates/websnark-rs" }

[profile.test]
opt-level = 1
