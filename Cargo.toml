[lib]
crate-type = ["cdylib", "rlib"]

[package]
name = "websnark-rs"
version = "0.1.1"
edition = "2024"
description = "Circom v1 transpiler and proof generation library in Rust"
license = "MIT"
repository = "https://github.com/Robert-MacWha/websnark-rs"
readme = "README.md"
keywords = ["snarkjs", "circom", "zk-snark", "websnark"]
categories = ["cryptography", "cryptography::cryptocurrencies"]
exclude = [
    "*/testdata/**/*",
    ".github/*",
    ".gitignore",
    "flake.lock",
    "flake.nix",
    "cliff.toml",
]

[package.metadata.docs.rs]
targets = ["wasm32-unknown-unknown"]
features = []

[features]
default = []
asm = ["ark-ff/asm"]
parallel = [
    "wasm-bindgen-rayon",
    "ark-ec/parallel",
    "ark-ff/parallel",
    "ark-poly/parallel",
]

[dependencies]
anyhow = "1.0.102"
ark-bn254 = { version = "0.5.0", features = ["std"] }
ark-ec = { version = "0.5.0", features = ["std"] }
ark-ff = { version = "0.5.0", features = ["std"] }
ark-poly = { version = "0.5.0", features = ["std"] }
ark-serialize = "0.5.0"
ark-std = "0.5.0"
lalrpop-util = "0.23.1"
num-bigint = "0.4.6"
num-traits = "0.2.19"
postcard = { version = "1.1.3", features = ["alloc"] }
rustc-hash = "2.1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1.44"

[dev-dependencies]
insta = "1.47.2"
tracing-test = "0.2.6"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = "0.8.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.118"
wasm-bindgen-rayon = { version = "1.3.0", optional = true }
wasm-bindgen-test = "=0.3.68"

[build-dependencies]
lalrpop = "0.23.1"

[[bench]]
name = "proof"
harness = false

[[bench]]
name = "witness"
harness = false

[profile.test]
# Required to avoid stack overflows in witness generation
opt-level = 1

[package.metadata.wasm-pack.profile.profiling]
wasm-opt = ['-O', '-g']
