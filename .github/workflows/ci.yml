name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  test-native:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v31
    - uses: nix-community/cache-nix-action@v7
      with:
        primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}

    - uses: Swatinem/rust-cache@v2

    - run: nix develop .#ci --command cargo check --all-features
    - run: nix develop .#ci --command cargo clippy --all-features -- -D warnings
    - run: nix develop .#ci --command cargo test --all-features

  test-wasm:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v31
    - uses: nix-community/cache-nix-action@v7
      with:
        primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}

    - uses: Swatinem/rust-cache@v2

    - run: nix develop .#ci --command cargo check --target wasm32-unknown-unknown --all-features
    - run: nix develop .#ci --command cargo test --target wasm32-unknown-unknown --all-features

  bench-native:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v31
    - uses: nix-community/cache-nix-action@v7
      with:
        primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}

    - uses: Swatinem/rust-cache@v2

    - run: nix develop .#ci --command cargo bench --features "serde"
    - run: nix develop .#ci --command cargo bench --features "serde,parallel"

  bench-wasm:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v31
    - uses: nix-community/cache-nix-action@v7
      with:
        primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}

    - uses: Swatinem/rust-cache@v2

    - run: nix develop .#ci --command cargo bench --target wasm32-unknown-unknown --features "serde"
